<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .s { fill: none; stroke: #2464A4; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .d { fill: #2464A4; }
    @media (prefers-color-scheme: dark) {
      .s { stroke: #63AEF2; }
      .d { fill: #63AEF2; }
    }
  </style>

  <!-- base plate -->
  <path class="s" d="M5.6 27.6h15" />
  <!-- pedestal rising to the shoulder -->
  <path class="s" d="M8.7 26.4c0-4.1.8-6.7 2.4-8.1" />
  <path class="s" d="M17.5 26.4c0-4.1-.8-6.7-2.4-8.1" />

  <!-- shoulder joint -->
  <circle class="s" cx="13.1" cy="17.6" r="3.7" />
  <circle class="d" cx="13.1" cy="17.6" r="1.35" />

  <!-- upper arm, shoulder to elbow -->
  <path class="s" d="M10.9 14.6 7.4 10.9" />
  <path class="s" d="M15.6 15.3 12.1 11.4" />

  <!-- elbow joint -->
  <circle class="s" cx="8.9" cy="8.7" r="3.7" />
  <circle class="d" cx="8.9" cy="8.7" r="1.35" />

  <!-- boom out to the wrist -->
  <path class="s" d="M12.2 7.1 20.6 7.7" />
  <path class="s" d="M12.4 10.6 20.6 10" />
  <path class="s" d="M20.6 7.7v2.3" />

  <!-- wrist joint -->
  <circle class="s" cx="23.6" cy="8.8" r="2.5" />
  <circle class="d" cx="23.6" cy="8.8" r="0.95" />

  <!-- wrist stem -->
  <path class="s" d="M23.6 11.3v2.1" />
  <path class="s" d="M21.3 13.6h4.6" />

  <!-- gripper: two claws around a centre finger -->
  <path class="s" d="M21.5 13.9 19.7 16.5l.9 2.9" />
  <path class="s" d="M25.7 13.9l1.8 2.6-.9 2.9" />
  <rect class="s" x="22.2" y="15.7" width="2.8" height="4.3" rx="0.7" />
</svg>
